# Push a tag v* (e.g. v0.2.0) -> runs the tests, builds the signed release APK
# and attaches it to a GitHub Release, ready to download on the phone.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "missing secret KEYSTORE_BASE64" >&2; exit 1; }
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "translate-selected-$GITHUB_REF_NAME.apk"
          # fixed name: releases/latest/download/translate-selected.apk always points to the newest version
          cp app/build/outputs/apk/release/app-release.apk translate-selected.apk

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            translate-selected-*.apk
            translate-selected.apk
          generate_release_notes: true
